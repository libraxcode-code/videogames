name: videogames
description: "A clean, lite, and maintainable Flutter project structured with Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  dartz: ^0.10.1
  equatable: ^2.0.5
  http: ^1.2.1
  dio: ^5.11.1
  crypto: ^3.0.7
  video_player: ^2.14.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
